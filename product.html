<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - ECOlink</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    window.logout = () => {
        auth.signOut().then(() => {
            window.location.href = "login.html";
        });
    };
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">
      <i class="ph-fill ph-leaf"></i> ECOlink
    </div>
    <div class="nav-links">
      <a href="index.html" class="active"><i class="ph ph-storefront"></i> Marketplace</a>
      <a href="sell.html"><i class="ph ph-plus-circle"></i> Sell Product</a>
      <button class="btn btn-secondary btn-sm" onclick="logout()"><i class="ph ph-sign-out"></i> Logout</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <a href="index.html" class="btn btn-secondary btn-sm" style="margin-bottom: 2rem;"><i class="ph ph-arrow-left"></i> Back to Marketplace</a>
    <div id="product">
       <!-- Loaded via product.js -->
    </div>
  </main>

  <script type="module" src="js/product.js"></script>

</body>
</html>
